<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Number Guessing Game</h1>
    <nav>
      <a href="index.html">Part A: Guessing Game</a>
      <a href="memory.html">Part B: Memory Game</a>
    </nav>
  </header>

  <main>
    <section class="panel" aria-labelledby="game-title">
      <h2 id="game-title">Guess a number between 1 and 100</h2>

      <div class="stats">
        <div class="stat"><span class="label">Clock</span><span class="value" id="clock">--:--:--</span></div>
        <div class="stat">
          <span class="label">Sound</span>
          <button type="button" id="sound-toggle" aria-pressed="true">On</button>
        </div>
      </div>

      <form id="guess-form" novalidate>
        <label for="guess-input">Your guess</label>
        <input type="number" id="guess-input" placeholder="Enter your guess..." inputmode="numeric" autocomplete="off">
        <button type="submit" class="primary" id="guess-button">Guess</button>
      </form>

      <p class="message" id="message" role="status" aria-live="polite">Take a guess to begin.</p>

      <div class="stats">
        <div class="stat"><span class="label">Guesses Left</span><span class="value" id="guesses-left">10</span></div>
        <div class="stat"><span class="label">Wins</span><span class="value" id="wins">0</span></div>
        <div class="stat"><span class="label">Rounds</span><span class="value" id="rounds">0</span></div>
      </div>
    </section>

    <p><a href="memory.html">Continue to Part B: Memory Matching Game &rarr;</a></p>
  </main>

  <script src="guess.js"></script>
</body>
</html>
